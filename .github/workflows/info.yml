name: info

# The harness with the timings left out: builds all four implementations and
# runs the --info stage over the fixture corpus. Nothing here is timed --
# shared, throttled runners are not a benchmarking environment, and
# benchmarks/results.json is only ever regenerated by hand on a quiet machine.
# See the README's "Run it locally, publish from CI".
on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

# cancel-in-progress, unlike the pages workflow: that one guards a deployment
# that can be left stuck if interrupted, and this one publishes nothing, so a
# superseded run is only wasted runner time.
concurrency:
  group: info-${{ github.ref }}
  cancel-in-progress: true

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      # `recursive`, where the pages workflow deliberately stops at the four
      # implementations: the fixture corpus reads the hbt-data golden files
      # through hbt-rs/test-data, which is a submodule of a submodule. Without
      # it every input is missing and the run fails with "nothing was parsed".
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: henrytill
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # .#bench builds all four implementations from their own flakes and passes
      # each one as --binary, so this is also the only workflow that would
      # notice an implementation that no longer builds.
      #
      # Out to RUNNER_TEMP, not the workspace: --info-only refuses the default
      # output, because a document with no timings must never be mistaken for
      # benchmarks/results.json, which is what the published page renders.
      #
      # It exits 1 if the implementations count any input differently, after
      # writing both files, so the steps below run on !cancelled() rather than
      # on success: the pins and the summary should not be lost to a count,
      # and the conformance matrix is what says which fields went wrong. The
      # pin and conformance steps first check that info.json was written --
      # it is only once every implementation has built -- so a broken build
      # or a refusal fails here once rather than being rebuilt by each.
      - run: |
          nix run -L .#bench -- --info-only \
            --corpus benchmarks/fixtures.toml \
            -o "$RUNNER_TEMP/info.json" \
            -r "$RUNNER_TEMP/info.md"

      # Pin the builds .#bench just made, so the cache keeps what master points
      # at. Master pushes only: pinned from a pull request, an unmerged
      # revision would take the pin and release master's. Before the
      # conformance step, so a failing matrix does not leave the pins behind
      # the pointers.
      #
      # No token here: cachix-action above has already stored it with
      # `cachix authtoken`, which is what `cachix pin` reads.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          [ -f "$RUNNER_TEMP/info.json" ] || exit 0
          scripts/pin-outputs.sh

      # The entity-count table is the interesting part, so put it where it can
      # be read without opening the log.
      - if: ${{ !cancelled() }}
        run: |
          [ -f "$RUNNER_TEMP/info.md" ] || exit 0
          cat "$RUNNER_TEMP/info.md" >> "$GITHUB_STEP_SUMMARY"

      # The conformance matrix: every implementation against the corpus it
      # pins, through the same builds .#bench just made. It fails the workflow
      # on a cell that is not PASS or XFAIL -- a fixture some implementation
      # does not satisfy.
      #
      # pipefail is what makes that true: the matrix is piped into tee for the
      # step summary, and without it the pipeline's status is tee's, so the
      # step would pass whatever the command exits with. A step with no
      # `shell:` runs under `bash -e`, which does not set it, so the script
      # sets it itself rather than resting on the shell line alone.
      - if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/info.json" ] || exit 0
          set -o pipefail
          nix run -L .#conformance | tee "$RUNNER_TEMP/conformance.txt"
      - if: ${{ !cancelled() }}
        run: |
          [ -f "$RUNNER_TEMP/conformance.txt" ] || exit 0
          { echo '```'; cat "$RUNNER_TEMP/conformance.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
