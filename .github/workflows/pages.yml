name: pages

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

# A second push supersedes the first; without this both run a full cold-runner
# build and the earlier deploy is overwritten moments after it lands.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No `submodules: true`: .#site renders a committed JSON file and never
      # references the implementation flake inputs, so it builds fine with the
      # submodule directories empty. Cloning four repos here would buy nothing.
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Renders benchmarks/results.json, which is committed from a local run.
      # Nothing is benchmarked here: shared, throttled runners are not a
      # benchmarking environment.
      - run: nix build -L .#site

      # Only master deploys, so on a pull request this would tar and store an
      # artifact nothing can consume. The build above is still worth running
      # there as a check.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: result/share/doc/hbt-analysis/html/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
