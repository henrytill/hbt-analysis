name: pages

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

# A second push supersedes the first: queueing means it deploys after, not
# alongside. Not cancel-in-progress, which this group would apply to the deploy
# job as well -- cancelling actions/deploy-pages mid-deployment can leave the
# Pages deployment stuck rather than simply superseded. GitHub's own Pages
# starter workflow sets it false for the same reason.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `submodules: true` even though .#site only renders a committed JSON
      # file and builds no implementation. The flake still has to *lock* them:
      # the inputs are relative `git+file:./hbt-*`, resolved against self, and
      # every push gives self a new rev, so nix re-locks and fetches. With the
      # submodule directories empty that fails with "Failed to fetch git
      # repository 'file:./hbt-ocaml'". Not needed recursively -- locking wants
      # the four trees, not the hbt-data each one pins.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Renders benchmarks/results.json, which is committed from a local run.
      # Nothing is benchmarked here: shared, throttled runners are not a
      # benchmarking environment.
      - run: nix build -L .#site

      # Only master deploys, so on a pull request this would tar and store an
      # artifact nothing can consume. The build above is still worth running
      # there as a check.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: result/share/doc/hbt-analysis/html/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
