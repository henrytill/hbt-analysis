name: update-submodules

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 reaches the submodules too, which actions/checkout
      # otherwise clones at depth 1 -- and in a shallow clone the summary
      # cannot count the commits each pointer moved by.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      # `shell: bash` is not redundant: a bare `run:` uses `bash -e {0}`, which
      # has no pipefail, so `tee` exiting 0 would mask a failed script.
      - run: scripts/update-submodules.sh | tee summary.txt
        shell: bash

      - run: scripts/open-submodule-pr.sh summary.txt
        env:
          GH_TOKEN: ${{ github.token }}
