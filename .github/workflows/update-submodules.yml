name: update-submodules

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  actions: write # to dispatch the info workflow on the new branch
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 reaches the submodules too, which actions/checkout
      # otherwise clones at depth 1. The re-lock needs it: nix will not lock a
      # shallow git+file: input ("'revCount' is not available"). It is also
      # what lets the summary count the commits each pointer moved by.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      # For the script's re-lock of flake.lock. No cachix: nothing is built.
      - uses: cachix/install-nix-action@v31

      # `shell: bash` is not redundant: a bare `run:` uses `bash -e {0}`, which
      # has no pipefail, so `tee` exiting 0 would mask a failed script.
      #
      # The runner's own perl, not nix's: Ubuntu's git package installs Git.pm
      # where the system perl looks, so nothing needs building first.
      - run: scripts/update-submodules.pl | tee summary.txt
        shell: bash

      - run: scripts/open-submodule-pr.sh summary.txt
        env:
          GH_TOKEN: ${{ github.token }}
