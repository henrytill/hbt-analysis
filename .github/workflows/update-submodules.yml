name: update-submodules

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # `shell: bash` is not redundant: a bare `run:` uses `bash -e {0}`, which
      # has no pipefail, so `tee` exiting 0 would mask a failed script.
      - run: scripts/update-submodules.sh | tee summary.txt
        shell: bash

      - run: scripts/open-submodule-pr.sh summary.txt
        env:
          GH_TOKEN: ${{ github.token }}
