name: update-submodules

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - run: scripts/update-submodules.sh | tee summary.txt

      - run: scripts/open-submodule-pr.sh summary.txt
        env:
          GH_TOKEN: ${{ github.token }}
