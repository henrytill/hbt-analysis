[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "hbt-bench"
dynamic = ["version", "description"]
readme = "README.md"
authors = [{ name = "Henry Till", email = "henrytill@gmail.com" }]
requires-python = ">=3.11"
# click builds the command line, jinja2 carries the report's prose and
# structure, tabulate renders its tables; everything else is the standard
# library, tomllib for the corpus and json for hyperfine's export. hyperfine
# itself is a runtime dependency, supplied by the flake.
dependencies = ["click>=8.1", "jinja2>=3.1.0", "tabulate>=0.9.0"]

[project.optional-dependencies]
# types-tabulate because tabulate ships no py.typed and mypy runs strict;
# jinja2 needs no stubs, it carries its own.
dev = [
    "black>=23.3.0",
    "flake8>=6.0.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "pylint>=3.3.4",
    "types-tabulate>=0.9.0",
]
test = []

[project.scripts]
hbt-bench = "hbt.bench.cli:cli"

# `hbt` is a PEP 420 namespace portion -- it has no __init__.py -- so flit
# cannot infer the module from the distribution name, which would give it
# `hbt_bench`. The dotted name names the package inside the namespace.
[tool.flit.module]
name = "hbt.bench"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
known_first_party = ["hbt"]
line_length = 120

[tool.mypy]
strict = true
check_untyped_defs = true
warn_redundant_casts = false
# `hbt` is a namespace portion with no __init__.py, so mypy cannot tell where
# the package root is: it would read hbt/bench/cli.py as both `bench.cli` and
# `hbt.bench.cli` and refuse. This makes the invocation directory the root.
explicit_package_bases = true

[tool.pylint]
# The counterpart of mypy's explicit_package_bases: without it pylint reads
# hbt/bench as the top-level module `bench` and cannot resolve `hbt.bench`.
source-roots = ["."]
max-line-length = 120
disable = [
    "C0114", # missing-module-docstring, too much
    "C0115", # missing-class-docstring, too much
    "C0301", # line-too-long, we use black for formatting
    "C0414", # useless-import-alias, we use aliases for type checking
    "R0903", # too-few-public-methods, come on
    "R0913", # too-many-arguments, i know
    "R0917", # too-many-positional-arguments, you already told me thanks
]

[tool.pyright]
strict = ["hbt"]
