[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hbt-analysis"
# The same sentence as hbt/analysis/__init__.py's docstring, which is the
# command-line help; hatchling cannot read a description from a docstring.
description = "Benchmark the hbt implementations, hold them to the conformance corpus, and to each other."
dynamic = ["version"]
readme = "README.md"
authors = [{ name = "Henry Till", email = "henrytill@gmail.com" }]
requires-python = ">=3.11"
# click builds the command line, jinja2 carries the report's prose and
# structure, tabulate renders its tables, hypothesis generates and shrinks
# hbt.fuzz's documents, and PyYAML's error type is what hbt.fuzz catches when an
# implementation's output does not parse; everything else is the standard
# library, tomllib for the corpus and json for hyperfine's export. hyperfine
# itself is a runtime dependency, supplied by the flake. hbt-conformance is
# henrytill/hbt-data's harness, which the conformance command imports; it is on
# no index, so the flake supplies that too.
dependencies = ["click>=8.1", "hypothesis>=6.100", "jinja2>=3.1.0", "PyYAML>=6.0", "tabulate>=0.9.0", "hbt-conformance"]

[project.optional-dependencies]
# types-tabulate and types-PyYAML because neither package ships py.typed and
# mypy runs strict; jinja2 needs no stubs, it carries its own.
dev = [
    "black>=23.3.0",
    "flake8>=6.0.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "pylint>=3.3.4",
    "types-PyYAML>=6.0",
    "types-tabulate>=0.9.0",
]
test = []

[project.scripts]
# One executable, with a command per job: `hbt-analysis bench` and
# `hbt-analysis conformance`.
hbt-analysis = "hbt.analysis.cli:cli"

[tool.hatch.version]
path = "hbt/analysis/__init__.py"

# Three members of the `hbt` PEP 420 namespace in one distribution, which is
# why this is hatchling and not flit: `hbt.analysis`, the tool, and `hbt.bench`
# and `hbt.fuzz`, the libraries it drives -- siblings of `hbt.conformance`. `hbt`
# itself has no __init__.py, so the wheel has to carry each package at its
# path inside the namespace. `only-include` rather than `packages`: hatchling
# collapses a `packages` path to its last component, which would install
# these as a top-level `analysis`, `bench` and `fuzz`.
[tool.hatch.build.targets.wheel]
only-include = ["hbt/analysis", "hbt/bench", "hbt/fuzz"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["hbt"]
line_length = 120

[tool.mypy]
strict = true
check_untyped_defs = true
warn_redundant_casts = false
# `hbt` is a namespace portion with no __init__.py, so mypy cannot tell where
# the package root is: it would read hbt/analysis/cli.py as both `analysis.cli`
# and `hbt.analysis.cli` and refuse. This makes the invocation directory the
# root.
explicit_package_bases = true

[tool.pylint]
# The counterpart of mypy's explicit_package_bases: without it pylint reads
# hbt/analysis as the top-level module `analysis` and cannot resolve
# `hbt.analysis`.
source-roots = ["."]
max-line-length = 120
disable = [
    "C0114", # missing-module-docstring, too much
    "C0115", # missing-class-docstring, too much
    "C0301", # line-too-long, we use black for formatting
    "C0414", # useless-import-alias, we use aliases for type checking
    "R0903", # too-few-public-methods, come on
    "R0913", # too-many-arguments, i know
    "R0917", # too-many-positional-arguments, you already told me thanks
]

[tool.pyright]
strict = ["hbt", "tests"]
